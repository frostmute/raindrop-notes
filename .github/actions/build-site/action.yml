name: Build site
description: Build the static site from notes/ and screenshots/ into _site/
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: site/requirements.txt
    - shell: bash
      run: pip install -r site/requirements.txt
    - shell: bash
      env:
        SITE_URL: https://frostmute.github.io/raindrop-notes
      run: python site/build.py
    - shell: bash
      env:
        SITE_URL: https://frostmute.github.io/raindrop-notes
      run: python site/check.py
