name: Sync Raindrop bookmarks

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raindrop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Fetch, screenshot, summarize
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          # Free tier (billing unlinked 2026-11-21). Remove these two lines if billing is re-linked.
          GEMINI_PRICE_IN: "0"
          GEMINI_PRICE_OUT: "0"
        run: node scripts/sync.mjs

      - name: Commit new notes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add notes screenshots state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add Raindrop notes $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Rebuild and publish the site when the sync committed something. Pushes made
  # with GITHUB_TOKEN don't trigger pages.yml, so the deploy runs here.
  pages:
    needs: sync
    if: needs.sync.result == 'success' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the commit the sync job just pushed, not the run's start SHA
      - uses: ./.github/actions/build-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
